<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSCM - Login Sistem Rantai Pasok Jasa</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header" style="text-align: center; margin-bottom: 28px;">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:14px; background:#eff6ff; margin-bottom:12px;">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <path d="M16 2L3 9.5V22.5L16 30L29 22.5V9.5L16 2Z" stroke="#1a62ff" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M16 2V30M3 9.5L29 22.5M29 9.5L3 22.5" stroke="#1a62ff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 style="font-size: 26px; font-weight: 800; color: #0f172a; margin: 0; letter-spacing: -0.5px;">SSCM<span style="color:#1a62ff;">.</span></h1>
      <p style="color: #64748b; font-size: 13px; margin-top: 4px;">Service Supply Chain Management • Bengkel & Salon Terpadu</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username Pengguna</label>
        <input type="text" id="username" name="username" required placeholder="admin atau kasir" value="admin" autofocus>
      </div>
      <div class="form-group" style="margin-bottom: 22px;">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" required placeholder="Password" value="admin123">
      </div>
      
      <div id="loginError" class="error-message" style="display:none; margin-bottom: 16px;"></div>
      
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn" style="padding: 12px; font-size: 14px; font-weight: 700;">
        Masuk ke Aplikasi ➔
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #f1f5f9; text-align: center; font-size: 12px; color: #94a3b8;">
      💡 Akun Demo: <code>admin</code> / <code>admin123</code> (Admin) | <code>kasir</code> / <code>kasir123</code> (Kasir)
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (API.getToken()) {
      window.location.href = '/dashboard';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errorEl.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const res = await API.post('/auth/login', { username, password });
        if (res.success && res.token) {
          API.setToken(res.token);
          API.setUser(res.user);
          window.location.href = '/dashboard';
        } else {
          errorEl.textContent = res.message || 'Login gagal.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Masuk ke Aplikasi ➔';
        }
      } catch (err) {
        errorEl.textContent = err.message || 'Koneksi gagal ke server.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk ke Aplikasi ➔';
      }
    }
  </script>
</body>
</html>
