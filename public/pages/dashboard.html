<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSCM - Dashboard Operasional Jasa</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="app-body">
  <div class="window-wrapper">
    <div class="dashboard-layout">
      <!-- Sidebar Navigation -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <!-- Window decorative dots -->
          <div class="window-dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          
          <!-- Brand Logo -->
          <div class="brand-logo">
            <div class="logo-cube">
              <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
                <path d="M16 2L3 9.5V22.5L16 30L29 22.5V9.5L16 2Z" stroke="#1a62ff" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M16 2V30M3 9.5L29 22.5M29 9.5L3 22.5" stroke="#1a62ff" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="brand-name">SSCM<strong>.</strong></span>
          </div>
        </div>

        <!-- Rendered by Sidebar.js -->
        <nav class="sidebar-nav" id="sidebarNav"></nav>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
          <button class="nav-item logout-item" onclick="API.logout()">
            <span class="icon">🚪</span>
            <span>Log Out</span>
          </button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Modern Top Header -->
        <header class="main-header">
          <div class="header-left">
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
            <div class="search-bar">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Cari SPK, no plat, atau pelanggan..." id="globalSearchInput" onkeyup="if(event.key==='Enter') App.handleGlobalSearch(this.value)" />
            </div>
          </div>

          <div class="header-right">
            <div class="user-profile-widget" title="Profil Pengguna">
              <div class="avatar-circle">
                <span id="userAvatarText" style="font-size:16px;">👤</span>
              </div>
              <div class="user-profile-meta">
                <span class="user-name" id="userName">Admin</span>
                <span class="user-role" id="userRole">ADMINISTRATOR</span>
              </div>
            </div>
          </div>
        </header>

        <!-- Dynamic Content Area (matching style.css .content-area) -->
        <div class="content-area" id="contentArea">
          <div style="text-align:center; padding:40px; color:var(--text-muted);">
            Memuat dashboard SSCM...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Dynamic Modal Overlay Container (matching style.css .modal-overlay) -->
  <div class="modal-overlay" id="modalContainer" style="display: none;"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/utils/format.js"></script>
  <script src="/js/components/Sidebar.js"></script>
  <script src="/js/components/Dashboard.js"></script>
  <script src="/js/components/Services.js"></script>
  <script src="/js/components/POS.js"></script>
  <script src="/js/components/Commissions.js"></script>
  <script src="/js/components/Items.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
